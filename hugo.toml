baseURL = 'https://forgottenprogramme.github.io/'
locale = 'en-us'
title = 'Mahe Iram Khan'

DefaultContentLanguage = "en"
enableRobotsTXT = true

# Only tags (no categories)
[taxonomies]
  tag = "tags"

[pagination]
  pagerSize = 10

# No RSS feeds: generate plain web pages only
[outputs]
  home = ["html"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark.renderer]
    # allow raw HTML such as <br> inside posts
    unsafe = true
  [markup.highlight]
    # keep code blocks plain and quiet (styled in assets/css/style.css)
    noClasses = false
    guessSyntax = false

[params]
  description = "I post my writings here."
  # Default social-card image (Open Graph link previews), relative to /static
  images = ["images/social-card.png"]

# Header navigation. Edit, reorder (weight) or add links here.
[[menus.main]]
  name = "Writing"
  pageRef = "/writing"
  weight = 10

[[menus.main]]
  name = "Tags"
  pageRef = "/tags"
  weight = 20

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 30

# Footer links
[[params.social]]
  name = "GitHub"
  url = "https://github.com/ForgottenProgramme"

[[params.social]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/irammahe/"
