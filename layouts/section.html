{{ define "main" }}
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>

  {{/* Posts grouped by year, newest first */}}
  {{ range .RegularPages.GroupByDate "2006" }}
    <section class="year">
      <h2 class="section-label">{{ .Key }}</h2>
      {{ partial "post-list.html" (dict "pages" .Pages "short" true) }}
    </section>
  {{ end }}
{{ end }}
