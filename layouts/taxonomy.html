{{/* The list of all tags (/tags/) */}}
{{ define "main" }}
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    <p class="lede">Browse writing by topic.</p>
  </header>

  <ul class="tag-list">
    {{ range .Data.Terms.Alphabetical }}
      <li>
        <a href="{{ .Page.RelPermalink }}">{{ .Page.Data.Term }}</a>
        <span class="count">{{ .Count }}</span>
      </li>
    {{ end }}
  </ul>
{{ end }}
